worker_processes 1;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe_technical '$time_iso8601 status=$status duration=$request_time request_id=$request_id';
  access_log /dev/stdout safe_technical;
  error_log /dev/stderr crit;
  server_tokens off;

  upstream e2e_auth_bff { server host.docker.internal:13001; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /health/live {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }
    location /auth/pc/ {
      proxy_pass http://e2e_auth_bff;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /authentication/ {
      proxy_pass http://e2e_auth_bff;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /tasks {
      proxy_pass http://e2e_auth_bff;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /form-definitions/ {
      proxy_pass http://e2e_auth_bff;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /__e2e/walking-skeleton/ {
      proxy_pass http://e2e_auth_bff;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /notifications {
      proxy_pass http://e2e_auth_bff;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /notification-templates {
      proxy_pass http://e2e_auth_bff;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /realtime {
      proxy_pass http://e2e_auth_bff/realtime;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
