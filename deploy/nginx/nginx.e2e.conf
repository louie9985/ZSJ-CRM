worker_processes 1;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
  log_format safe_technical '$time_iso8601 status=$status duration=$request_time request_id=$request_id';
  access_log /dev/stdout safe_technical;
  error_log /dev/stderr warn;
  server_tokens off;

  upstream e2e_api { server api-e2e:3000; }
  upstream e2e_workbench { server workbench-e2e:8080; }

  server {
    listen 8080;
    location = /health/live {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }
    location = /health/ready {
      proxy_pass http://e2e_api/health/ready;
    }
    location /api/ {
      error_log /dev/stderr crit;
      proxy_pass http://e2e_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
    location / {
      proxy_pass http://e2e_workbench;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
