name: ai-crm-e2e-browser-auth

services:
  nginx:
    ports: ["127.0.0.1:${AI_CRM_E2E_BROWSER_EDGE_PORT:-18088}:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${AI_CRM_E2E_BROWSER_NGINX_CONFIG:-../nginx/nginx.e2e-browser-auth.conf}:/etc/nginx/nginx.conf:ro
      - ../../apps/workbench-web/dist/web:/usr/share/nginx/html:ro

secrets:
  pc_session_encryption_key:
    file: ${AI_CRM_COMPOSE_SECRET_DIR}/pc_session_encryption_key
  pc_session_index_key:
    file: ${AI_CRM_COMPOSE_SECRET_DIR}/pc_session_index_key
