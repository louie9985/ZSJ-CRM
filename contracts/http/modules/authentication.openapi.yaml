openapi: 3.1.0
info:
  title: AI-CRM Internal Authentication API
  version: 1.0.0
paths:
  /auth/pc/login:
    post:
      operationId: loginPc
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedPcSession" }
        "401": { $ref: "#/components/responses/AuthenticationInvalidCredentials" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/pc/session:
    get:
      operationId: getPcSession
      x-ai-crm-audiences: [internal]
      responses:
        "200": { $ref: "#/components/responses/PcSession" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/pc/reauthentication:
    post:
      operationId: reauthenticatePc
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedPcSession" }
        "401": { $ref: "#/components/responses/AuthenticationInvalidCredentials" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/pc/assignment:
    post:
      operationId: selectPcAssignment
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedPcSession" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/pc/logout:
    post:
      operationId: logoutPc
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/ConditionalCsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      responses:
        "204":
          description: Session revoked and Cookie cleared idempotently.
          headers: { Set-Cookie: { $ref: "#/components/headers/PcSessionCookie" } }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/internal-h5/login:
    post:
      operationId: loginInternalH5
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedInternalH5Session" }
        "401": { $ref: "#/components/responses/AuthenticationInvalidCredentials" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/internal-h5/session:
    get:
      operationId: getInternalH5Session
      x-ai-crm-audiences: [internal]
      responses:
        "200": { $ref: "#/components/responses/InternalH5Session" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/internal-h5/reauthentication:
    post:
      operationId: reauthenticateInternalH5
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedInternalH5Session" }
        "401": { $ref: "#/components/responses/AuthenticationInvalidCredentials" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/internal-h5/assignment:
    post:
      operationId: selectInternalH5Assignment
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedInternalH5Session" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/internal-h5/logout:
    post:
      operationId: logoutInternalH5
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/ConditionalCsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      responses:
        "204":
          description: Session revoked and Cookie cleared idempotently.
          headers: { Set-Cookie: { $ref: "#/components/headers/InternalH5SessionCookie" } }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/part-time/login:
    post:
      operationId: loginPartTime
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedInternalH5Session" }
        "401": { $ref: "#/components/responses/AuthenticationInvalidCredentials" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/part-time/session:
    get:
      operationId: getPartTimeSession
      x-ai-crm-audiences: [internal]
      responses:
        "200": { $ref: "#/components/responses/InternalH5Session" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/part-time/reauthentication:
    post:
      operationId: reauthenticatePartTime
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReauthenticationRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedPartTimeSession" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
  /auth/part-time/logout:
    post:
      operationId: logoutPartTime
      x-ai-crm-audiences: [internal]
      parameters: [{ $ref: "#/components/parameters/ConditionalCsrfToken" }, { $ref: "#/components/parameters/Origin" }, { $ref: "#/components/parameters/Referer" }]
      responses:
        "204": { description: Part-time Session revoked and Cookie cleared idempotently., headers: { Set-Cookie: { $ref: "#/components/headers/PartTimeSessionCookie" } } }
        "403": { $ref: "#/components/responses/AuthenticationCsrfRejected" }
        "503": { $ref: "#/components/responses/AuthenticationUnavailable" }
components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 512 }
    ConditionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request carries a valid Session; omitted only to clear an absent or invalid Session Cookie.
      schema: { type: string, minLength: 32, maxLength: 512 }
    Origin:
      name: Origin
      in: header
      required: false
      schema: { type: string, format: uri, maxLength: 512 }
    Referer:
      name: Referer
      in: header
      required: false
      schema: { type: string, format: uri, maxLength: 2048 }
  headers:
    PcSessionCookie:
      required: true
      description: Host-only opaque PC Session Cookie with HttpOnly, Secure, SameSite=Lax and Path=/.
      schema: { type: string, maxLength: 1024 }
    InternalH5SessionCookie:
      required: true
      description: Host-only opaque internal H5 Session Cookie with HttpOnly, Secure, SameSite=Lax and Path=/.
      schema: { type: string, maxLength: 1024 }
    PartTimeSessionCookie:
      required: true
      description: Host-only opaque part-time CRM Session Cookie with HttpOnly, Secure, SameSite=Lax and Path=/.
      schema: { type: string, maxLength: 1024 }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 64 }
    ReauthenticationRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 64 }
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [assignmentId]
      properties:
        assignmentId: { type: string, format: uuid }
    BrowserSession:
      type: object
      additionalProperties: false
      required: [surface, accountId, authenticatedAt, idleExpiresAt, absoluteExpiresAt, csrfToken, assignments, roles]
      properties:
        surface: { type: string, enum: [pc, internal-h5, part-time] }
        accountId: { type: string, format: uuid }
        authenticatedAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
        reauthenticatedUntil: { type: string, format: date-time }
        csrfToken: { type: string, minLength: 32, maxLength: 512 }
        currentAssignmentId: { type: string, format: uuid }
        assignments:
          type: array
          maxItems: 64
          items: { type: string, format: uuid }
        roles:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [system_administrator, application_user, crm_administrator] }
    AuthenticationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [authentication_invalid_credentials, authentication_required, authentication_csrf_rejected, authentication_rate_limited, authentication_dependency_unavailable]
        message: { type: string, maxLength: 200 }
  responses:
    PcSession:
      description: Current valid PC Session.
      content: { application/json: { schema: { $ref: "#/components/schemas/BrowserSession" } } }
    InternalH5Session:
      description: Current valid internal H5 Session.
      content: { application/json: { schema: { $ref: "#/components/schemas/BrowserSession" } } }
    PartTimeSession:
      description: Current valid part-time Session.
      content: { application/json: { schema: { $ref: "#/components/schemas/BrowserSession" } } }
    AuthenticatedPcSession:
      description: PC Session created or rotated.
      headers: { Set-Cookie: { $ref: "#/components/headers/PcSessionCookie" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/BrowserSession" } } }
    AuthenticatedInternalH5Session:
      description: Internal H5 Session created or rotated.
      headers: { Set-Cookie: { $ref: "#/components/headers/InternalH5SessionCookie" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/BrowserSession" } } }
    AuthenticatedPartTimeSession:
      description: Part-time Session created or rotated.
      headers: { Set-Cookie: { $ref: "#/components/headers/PartTimeSessionCookie" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/BrowserSession" } } }
    AuthenticationInvalidCredentials:
      description: Identifier, password or account state is invalid without distinguishing the cause.
      content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationError" } } }
    AuthenticationRequired:
      description: A valid Session is required.
      content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationError" } } }
    AuthenticationCsrfRejected:
      description: CSRF or same-origin validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationError" } } }
    AuthenticationRateLimited:
      description: Login failure limit reached for the identifier or source address.
      content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationError" } } }
    AuthenticationUnavailable:
      description: A required authentication dependency is unavailable and access fails closed.
      content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationError" } } }
