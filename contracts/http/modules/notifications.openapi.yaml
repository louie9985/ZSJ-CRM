openapi: 3.1.0
info: { title: AI-CRM In-App Notifications API, version: 0.1.0 }
paths:
  /notifications:
    get:
      operationId: listNotifications
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.in-app-notification:list, resource: platform.notifications.in-app-notification, action: list }
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 128 } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Current principal's visible in-app notifications., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.in-app-notification:list, resource: platform.notifications.in-app-notification, action: list }
      responses:
        "200": { description: Current principal's unread count., content: { application/json: { schema: { type: object, additionalProperties: false, required: [count], properties: { count: { type: integer, minimum: 0 } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /notifications/{notificationId}:
    get:
      operationId: getNotification
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.in-app-notification:read, resource: platform.notifications.in-app-notification, action: read }
      parameters: [ { $ref: "#/components/parameters/NotificationId" } ]
      responses:
        "200": { description: Current principal's notification after object authorization., content: { application/json: { schema: { $ref: "#/components/schemas/InAppNotification" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Notification does not exist for the current principal. }
        "503": { $ref: "#/components/responses/Unavailable" }
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.in-app-notification:mark-read, resource: platform.notifications.in-app-notification, action: mark-read }
      description: Idempotently changes only the current principal's in-app read state; it never completes a task or business action.
      parameters: [ { $ref: "#/components/parameters/NotificationId" } ]
      responses:
        "200": { description: Updated in-app notification., content: { application/json: { schema: { $ref: "#/components/schemas/InAppNotification" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Notification does not exist for the current principal. }
        "503": { $ref: "#/components/responses/Unavailable" }
  /notifications/{notificationId}/archive:
    post:
      operationId: archiveNotification
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.in-app-notification:archive, resource: platform.notifications.in-app-notification, action: archive }
      parameters: [ { $ref: "#/components/parameters/NotificationId" } ]
      responses:
        "200": { description: Idempotently archived in-app notification., content: { application/json: { schema: { $ref: "#/components/schemas/InAppNotification" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Notification does not exist for the current principal. }
        "503": { $ref: "#/components/responses/Unavailable" }
  /notification-templates:
    get:
      operationId: listNotificationTemplates
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.template:read, resource: platform.notifications.template, action: read }
      responses:
        "200": { description: Registered template definitions visible to an authorized administrator., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NotificationTemplateSummary" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notification-templates/{templateKey}:
    get:
      operationId: getNotificationTemplateAdministration
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.template:read, resource: platform.notifications.template, action: read }
      parameters: [{ $ref: "#/components/parameters/TemplateKey" }]
      responses:
        "200": { description: "Definition, variable catalog, mutable draft, releases, and active version.", content: { application/json: { schema: { $ref: "#/components/schemas/NotificationTemplateSummary" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Template definition is not registered. }
  /notification-templates/{templateKey}/draft:
    put:
      operationId: saveNotificationTemplateDraft
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.template:manage, resource: platform.notifications.template, action: manage }
      parameters: [{ $ref: "#/components/parameters/TemplateKey" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateDraftWrite" } } } }
      responses:
        "200": { description: Idempotent revision-protected draft result., content: { application/json: { schema: { $ref: "#/components/schemas/TemplateDraft" } } } }
        "409": { description: Revision or idempotency operation conflicts with current state. }
  /notification-templates/{templateKey}/preview:
    post:
      operationId: previewNotificationTemplate
      description: Preview inputs are validated and rendered in memory and are never persisted or included in telemetry or Audit content.
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.template:manage, resource: platform.notifications.template, action: manage }
      parameters: [{ $ref: "#/components/parameters/TemplateKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TemplatePreviewRequest" } } } }
      responses:
        "200": { description: Non-persistent rendered preview., content: { application/json: { schema: { $ref: "#/components/schemas/RenderedTemplate" } } } }
  /notification-templates/{templateKey}/publish:
    post:
      operationId: publishNotificationTemplate
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.template:publish, resource: platform.notifications.template, action: publish }
      parameters: [{ $ref: "#/components/parameters/TemplateKey" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { description: New immutable release atomically published and activated., content: { application/json: { schema: { $ref: "#/components/schemas/TemplateRelease" } } } }
  /notification-templates/{templateKey}/activate:
    post:
      operationId: activateNotificationTemplateRelease
      description: Activates an immutable release, including explicit rollback to a historical version, for future notifications only.
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.notifications, code: platform.notifications.template:activate, resource: platform.notifications.template, action: activate }
      parameters: [{ $ref: "#/components/parameters/TemplateKey" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [version], properties: { version: { type: integer, minimum: 1 } } } } } }
      responses:
        "200": { description: Release activation recorded. }
components:
  parameters:
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    TemplateKey: { name: templateKey, in: path, required: true, schema: { $ref: "#/components/schemas/StableId" } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { $ref: "#/components/schemas/StableId" } }
  responses:
    Unauthorized: { description: No valid internal BFF session. }
    Forbidden: { description: Current server-side authorization denied. }
    Unavailable: { description: "Authorization, audit, recipient resolution, template validation, or storage failed closed." }
  schemas:
    StableId: { type: string, pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,254}$" }
    DeepLink:
      type: object
      additionalProperties: false
      required: [applicationId,routeId,resourceType,resourceId]
      properties:
        applicationId: { $ref: "#/components/schemas/StableId" }
        routeId: { $ref: "#/components/schemas/StableId" }
        resourceType: { $ref: "#/components/schemas/StableId" }
        resourceId: { $ref: "#/components/schemas/StableId" }
        parameters: { type: object, maxProperties: 20, additionalProperties: { $ref: "#/components/schemas/StableId" } }
    InAppNotification:
      type: object
      additionalProperties: false
      required: [notificationId,intentId,principalId,recipientReference,resolutionReference,resolutionVersion,templateKey,templateVersion,notificationType,title,summary,body,bodyFormat,stateVersion,sourceType,sourceId,deepLink,preferenceDecision,preferenceReason,preferenceVersion,createdAt]
      properties:
        notificationId: { type: string, format: uuid }
        intentId: { type: string, format: uuid }
        principalId: { $ref: "#/components/schemas/StableId" }
        recipientReference: { $ref: "#/components/schemas/StableId" }
        resolutionReference: { $ref: "#/components/schemas/StableId" }
        resolutionVersion: { $ref: "#/components/schemas/StableId" }
        templateKey: { $ref: "#/components/schemas/StableId" }
        templateVersion: { type: integer, minimum: 1 }
        notificationType: { $ref: "#/components/schemas/StableId" }
        title: { type: string, maxLength: 512 }
        summary: { type: string, minLength: 1, maxLength: 2000 }
        body: { type: string, maxLength: 8000 }
        bodyFormat: { type: string, enum: [plain-text,restricted-markdown] }
        contentDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        stateVersion: { type: integer, minimum: 1 }
        sourceType: { $ref: "#/components/schemas/StableId" }
        sourceId: { $ref: "#/components/schemas/StableId" }
        deepLink: { $ref: "#/components/schemas/DeepLink" }
        preferenceDecision: { type: string, enum: [deliver,suppress] }
        preferenceReason: { $ref: "#/components/schemas/StableId" }
        preferenceVersion: { $ref: "#/components/schemas/StableId" }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InAppNotification" } }
        nextCursor: { type: string, maxLength: 128 }
    TemplateVariable:
      type: object
      additionalProperties: false
      required: [key,label,description,ownerModule,source,privacy,type,example]
      properties:
        key: { $ref: "#/components/schemas/StableId" }
        label: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        ownerModule: { $ref: "#/components/schemas/StableId" }
        source: { type: string, enum: [domain,notification.owner,notification.sender,notification.time] }
        privacy: { type: string, enum: [internal,personal] }
        type: { type: string, enum: [string,integer,number,boolean,date-time] }
        example: { type: [string,number,boolean,"null"] }
        maximumLength: { type: integer, minimum: 1, maximum: 8000 }
    TemplateDefinition:
      type: object
      additionalProperties: false
      required: [templateKey,ownerModule,notificationType,definitionVersion,allowedVariables,variableCatalogVersion,systemSenderName,enabled]
      properties:
        templateKey: { $ref: "#/components/schemas/StableId" }
        ownerModule: { $ref: "#/components/schemas/StableId" }
        notificationType: { $ref: "#/components/schemas/StableId" }
        definitionVersion: { type: integer, minimum: 1 }
        allowedVariables: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/TemplateVariable" } }
        variableCatalogVersion: { type: integer, minimum: 1 }
        systemSenderName: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
    TemplateDraft:
      type: object
      additionalProperties: false
      required: [templateKey,revision,titleTemplate,summaryTemplate,bodyTemplate,updatedAt]
      properties:
        templateKey: { $ref: "#/components/schemas/StableId" }
        revision: { type: integer, minimum: 1 }
        titleTemplate: { type: string, minLength: 1, maxLength: 512 }
        summaryTemplate: { type: string, minLength: 1, maxLength: 2000 }
        bodyTemplate: { type: string, minLength: 1, maxLength: 8000 }
        updatedAt: { type: string, format: date-time }
    TemplateDraftWrite:
      type: object
      additionalProperties: false
      required: [expectedRevision,titleTemplate,summaryTemplate,bodyTemplate]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        titleTemplate: { type: string, minLength: 1, maxLength: 512 }
        summaryTemplate: { type: string, minLength: 1, maxLength: 2000 }
        bodyTemplate: { type: string, minLength: 1, maxLength: 8000 }
    TemplatePreviewRequest:
      type: object
      additionalProperties: false
      required: [titleTemplate,summaryTemplate,bodyTemplate]
      properties:
        titleTemplate: { type: string, minLength: 1, maxLength: 512 }
        summaryTemplate: { type: string, minLength: 1, maxLength: 2000 }
        bodyTemplate: { type: string, minLength: 1, maxLength: 8000 }
        exampleVariables: { type: object, maxProperties: 100, additionalProperties: { type: [string,number,boolean,"null"] } }
    RenderedTemplate:
      type: object
      additionalProperties: false
      required: [title,summary,body]
      properties: { title: { type: string, maxLength: 512 }, summary: { type: string, maxLength: 2000 }, body: { type: string, maxLength: 8000 } }
    TemplateRelease:
      type: object
      additionalProperties: true
      required: [templateKey,version,titleTemplate,summaryTemplate,bodyTemplate,bodyFormat,contentDigest,publishedAt]
      properties:
        templateKey: { $ref: "#/components/schemas/StableId" }
        version: { type: integer, minimum: 1 }
        titleTemplate: { type: string, maxLength: 512 }
        summaryTemplate: { type: string, maxLength: 2000 }
        bodyTemplate: { type: string, maxLength: 8000 }
        bodyFormat: { const: restricted-markdown }
        contentDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        publishedAt: { type: string, format: date-time }
    NotificationTemplateSummary:
      type: object
      additionalProperties: false
      required: [definition,releases]
      properties:
        definition: { $ref: "#/components/schemas/TemplateDefinition" }
        draft: { $ref: "#/components/schemas/TemplateDraft" }
        releases: { type: array, items: { $ref: "#/components/schemas/TemplateRelease" } }
        currentVersion: { type: integer, minimum: 1 }
