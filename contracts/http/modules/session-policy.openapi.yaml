openapi: 3.1.0
info: { title: AI-CRM PC Session Policy API, version: 0.1.0 }
paths:
  /authentication/session-policy:
    get:
      operationId: getPcSessionPolicy
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.authentication, code: platform.authentication.session-policy:read, resource: platform.authentication.session-policy, action: read }
      responses:
        "200": { description: Current effective PC Web session policy., content: { application/json: { schema: { $ref: "#/components/schemas/PcSessionPolicy" } } } }
        "401": { description: Authentication is required. }
        "403": { description: The current workforce subject may not read login security policy. }
        "503": { description: Authorization or configuration storage is unavailable. }
    put:
      operationId: updatePcSessionPolicy
      x-ai-crm-audiences: [internal]
      x-ai-crm-permission: { version: 1, owner: platform.authentication, code: platform.authentication.session-policy:manage, resource: platform.authentication.session-policy, action: manage }
      x-ai-crm-csrf: { required: true, originCheck: true }
      x-ai-crm-idempotency: { required: true, header: Idempotency-Key, semantics: stable-operation }
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 512 } }
        - { name: Origin, in: header, required: false, schema: { type: string, format: uri, maxLength: 512 } }
        - { name: Referer, in: header, required: false, schema: { type: string, format: uri, maxLength: 2048 } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid, minLength: 36, maxLength: 36 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PcSessionPolicy" } } }
      responses:
        "200": { description: Newly effective PC Web session policy., content: { application/json: { schema: { $ref: "#/components/schemas/PcSessionPolicy" } } } }
        "400": { description: The body or operation identifier is invalid. }
        "401": { description: Authentication is required. }
        "403": { description: CSRF validation failed or the current subject may not manage login security policy. }
        "409": { description: The operation identifier conflicts with an earlier operation. }
        "503": { description: "Authorization, audit, or configuration storage is unavailable." }
components:
  schemas:
    PcSessionPolicy:
      type: object
      additionalProperties: false
      required: [concurrentLimit, revocationTargetSeconds]
      properties:
        concurrentLimit: { type: integer, minimum: 1, maximum: 5, default: 1 }
        revocationTargetSeconds: { type: integer, minimum: 5, maximum: 60, default: 5 }
