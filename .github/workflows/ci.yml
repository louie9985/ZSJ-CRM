name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @zsj/shared-core build
      - run: pnpm --filter @zsj/server exec prisma generate
      - run: pnpm --filter @zsj/server build
      - name: lint (含 boundary 边界检查)
        run: pnpm -w lint
      - name: tsc
        run: pnpm -w tsc
      - name: test
        run: pnpm -w test
